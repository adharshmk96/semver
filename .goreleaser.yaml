version: 2

project_name: semver

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - main: .
    binary: semver
    ldflags:
      - -s -w -X "main.SemVer={{ .Tag }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: semver
    homepage: https://github.com/adharshmk96/semver
    description: Semantic version management CLI for git tags and .version files
    license: MIT
    repository:
      owner: adharshmk96
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # The released binaries are unsigned, so strip the quarantine attribute
    # Homebrew would otherwise leave on them.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/semver"]
          end

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
    include:
      - "^feat:"
      - "^fix:"
      - "^refactor:"
      - "^chore:"
      - "^perf:"


